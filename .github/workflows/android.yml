name: Android CI

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the APK as a GitHub Release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships the Android SDK with ANDROID_HOME set; AGP fetches
      # any missing platform itself.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && test -d "$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew :core:test :drivecore:test

      - name: App unit tests (Robolectric)
        run: ./gradlew :app:testDebugUnitTest :driveapp:testDebugUnitTest

      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug :driveapp:assembleDebug

      - name: Name the APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk QuarterHour-debug.apk
          cp driveapp/build/outputs/apk/debug/driveapp-debug.apk RoadReady-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: quarterhour-debug-apk
          path: QuarterHour-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: roadready-debug-apk
          path: RoadReady-debug.apk

      # A release gives a direct, phone-friendly download link:
      # https://github.com/<owner>/<repo>/releases/latest/download/QuarterHour-debug.apk
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Debug build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Debug builds of QuarterHour and RoadReady Oregon from `${{ github.ref_name }}` (${{ github.sha }}).
            On your phone: download QuarterHour-debug.apk or RoadReady-debug.apk below, open it, and allow installing from this source when asked.
          files: |
            QuarterHour-debug.apk
            RoadReady-debug.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
            drivecore/build/reports/tests
            driveapp/build/reports/tests
